<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran - Perpustakaan Digital Mahasiswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Informasi Perpustakaan Digital Mahasiswa</h1>
    <p>Universitas Pamulang Kampus Serang</p>
  </header>

  <nav>
    <a href="index.html" >Home</a>
    <a href="halaman2.html" >Pustakawan</a>
    <a href="halaman3.html" >Jadwal</a>
    <a href="halaman4.html" >Galeri</a>
    <a href="halaman5.html" class="aktif">Pendaftaran</a>
  </nav>

  <main>
    <h2>Form Pendaftaran Pelatihan Karier Mahasiswa</h2>
    <form action="#" method="post">

      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" required>

      <label for="nim">NIM</label>
      <input type="text" id="nim" name="nim" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label>Jenis Kelamin</label>
      <input type="radio" id="lk" name="jk" value="Laki-laki" required>
      <label for="lk" class="radio">Laki-laki</label>
      <input type="radio" id="pr" name="jk" value="Perempuan">
      <label for="pr" class="radio">Perempuan</label>

      <label for="pelatihan">Pilihan Pelatihan</label>
      <select id="pelatihan" name="pelatihan">
        <option value="">-- Pilih Pelatihan --</option>
        <option>Pengenalan Perpustakaan Digital</option>
        <option>Pelatihan Pencarian Referensi</option>
        <option>Workshop Sitasi dan Daftar Pustaka</option>
        <option>Diskusi Literasi Informasi</option>
      </select>

      <label for="semester">Semester</label>
      <select id="semester" name="semester">
        <option value="">-- Pilih Semester --</option>
        <option>1</option><option>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>7</option><option>8</option>
      </select>

      <label for="alasan">Alasan Mengikuti</label>
      <textarea id="alasan" name="alasan" rows="4"></textarea>

      <button type="submit">Daftar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Perpustakaan Digital Mahasiswa - Universitas Pamulang Kampus Serang</p>
  </footer>
</body>
</html>
